# Continuous integration
name: github-continuous-integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Use VS 2026 preview runner (GA May 4, 2026, then switch to windows-2025)
    runs-on: windows-2025-vs2026
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        configuration: [ 'Release', 'Debug', 'Release_Unicode', 'Debug_Unicode' ]
        platform: [ 'Win32', 'x64', 'ARM64', 'ARM64EC' ]
        exclude:
          # ARM64/ARM64EC only need Unicode builds
          - platform: ARM64
            configuration: Release
          - platform: ARM64
            configuration: Debug
          - platform: ARM64EC
            configuration: Release
          - platform: ARM64EC
            configuration: Debug

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'

    - name: Install Windows 11 SDK (10.0.22621.0)
      shell: pwsh
      run: |
        & "${{ github.workspace }}\scripts\install-winsdk.ps1"

    - name: "Build"
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $msbuildPath = Join-Path $vsPath "MSBuild\Current\Bin\amd64\msbuild.exe"
        & $msbuildPath /m /p:Configuration="${{matrix.configuration}}" /p:Platform="${{matrix.platform}}" mfcmapi.sln

    - name: Find vstest.console.exe
      if: matrix.platform != 'ARM64' && matrix.platform != 'ARM64EC'
      run: |
        $VSDevTestCmd = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere" -latest -prerelease -products * -find Common7\IDE\Extensions\TestPlatform\vstest.console.exe
        if (!$VSDevTestCmd) { exit 1 }
        echo "Using VSDevTestCmd: ${VSDevTestCmd}"
        Add-Content $env:GITHUB_ENV "VSDevTestCmd=$VSDevTestCmd"

    - name: MFCMAPI UnitTests
      if: matrix.platform != 'ARM64' && matrix.platform != 'ARM64EC'
      timeout-minutes: 8
      shell: pwsh
      run: |
        $results = Join-Path $env:GITHUB_WORKSPACE 'TestResults'
        New-Item -ItemType Directory -Path $results -Force | Out-Null
        $settings = Join-Path $results 'hang-diagnostics.runsettings'
        @'
        <RunSettings>
          <DataCollectionRunSettings>
            <DataCollectors>
              <DataCollector friendlyName="Code Coverage">
                <Configuration>
                  <CodeCoverage>
                    <EnableStaticNativeInstrumentationRestore>False</EnableStaticNativeInstrumentationRestore>
                  </CodeCoverage>
                </Configuration>
              </DataCollector>
            </DataCollectors>
          </DataCollectionRunSettings>
        </RunSettings>
        '@ | Set-Content -LiteralPath $settings -Encoding utf8
        $assembly = Join-Path $env:GITHUB_WORKSPACE 'bin\${{matrix.platform}}\UnitTest\${{matrix.configuration}}\UnitTest.dll'
        # Hosted runners have no matching-bitness Outlook MAPI runtime.
        # Run these integration tests locally on an Outlook-equipped machine.
        & $env:VSDevTestCmd /Parallel /EnableCodeCoverage /Logger:trx `
          '/TestCaseFilter:FullyQualifiedName!~compressedrtfintegrationtest' `
          "/Settings:$settings" "/ResultsDirectory:$results" "/Diag:$results\vstest.log" `
          '/Blame:CollectHangDump;TestTimeout=2min;HangDumpType=mini' $assembly
        exit $LASTEXITCODE

    # - name: Upload Event File
    #   uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
    #   with:
    #     name: Event File (${{ matrix.platform }} - ${{ matrix.configuration }})
    #     path: ${{ github.event_path }}
 
    - name: Upload Test Result Files
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always() && matrix.platform != 'ARM64' && matrix.platform != 'ARM64EC'
      with:
        name: Test Results (${{ matrix.platform }} - ${{ matrix.configuration }})
        path: |
          ${{github.workspace}}/**/TestResults/**/*
          ${{github.workspace}}\bin\${{matrix.platform}}\UnitTest\${{matrix.configuration}}\UnitTest.dll
          ${{github.workspace}}\bin\${{matrix.platform}}\UnitTest\${{matrix.configuration}}\UnitTest*.pdb

    - name: Upload ARM64 Binaries
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.platform == 'ARM64' && matrix.configuration == 'Release_Unicode'
      with:
        name: ARM64 Release Binaries
        path: |
          ${{github.workspace}}/bin/ARM64/MFCMapi/Release_Unicode/*.exe
          ${{github.workspace}}/bin/ARM64/MrMAPI/Release_Unicode/*.exe

    - name: Upload ARM64EC Binaries
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.platform == 'ARM64EC' && matrix.configuration == 'Release_Unicode'
      with:
        name: ARM64EC Release Binaries
        path: |
          ${{github.workspace}}/bin/ARM64EC/MFCMapi/Release_Unicode/*.exe
          ${{github.workspace}}/bin/ARM64EC/MrMAPI/Release_Unicode/*.exe

  publish-test-results:
    name: "Publish Tests Results"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      checks: write
      # only needed unless run with comment_mode: off
      pull-requests: write
      security-events: write
    if: always()

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          files: "artifacts/**/*.trx"
